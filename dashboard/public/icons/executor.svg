<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Sword: 8-bit dark fantasy style -->
  <!-- Blade highlight -->
  <rect x="22" y="2" width="2" height="2" fill="#e0e8ff"/>
  <rect x="20" y="4" width="2" height="2" fill="#e0e8ff"/>
  <rect x="18" y="6" width="2" height="2" fill="#e0e8ff"/>
  <rect x="16" y="8" width="2" height="2" fill="#e0e8ff"/>
  <rect x="14" y="10" width="2" height="2" fill="#e0e8ff"/>
  <!-- Blade body -->
  <rect x="24" y="2" width="2" height="2" fill="#8ba4cc"/>
  <rect x="24" y="4" width="2" height="2" fill="#8ba4cc"/>
  <rect x="22" y="4" width="2" height="2" fill="#b0c4e8"/>
  <rect x="22" y="6" width="2" height="2" fill="#8ba4cc"/>
  <rect x="20" y="6" width="2" height="2" fill="#b0c4e8"/>
  <rect x="20" y="8" width="2" height="2" fill="#8ba4cc"/>
  <rect x="18" y="8" width="2" height="2" fill="#b0c4e8"/>
  <rect x="18" y="10" width="2" height="2" fill="#8ba4cc"/>
  <rect x="16" y="10" width="2" height="2" fill="#b0c4e8"/>
  <rect x="16" y="12" width="2" height="2" fill="#8ba4cc"/>
  <rect x="14" y="12" width="2" height="2" fill="#b0c4e8"/>
  <!-- Blade tip -->
  <rect x="26" y="2" width="2" height="2" fill="#b0c4e8"/>
  <rect x="26" y="4" width="2" height="2" fill="#8ba4cc"/>
  <rect x="28" y="2" width="2" height="2" fill="#6b82a8"/>
  <!-- Blade edge -->
  <rect x="24" y="6" width="2" height="2" fill="#6b82a8"/>
  <rect x="22" y="8" width="2" height="2" fill="#6b82a8"/>
  <rect x="20" y="10" width="2" height="2" fill="#6b82a8"/>
  <rect x="18" y="12" width="2" height="2" fill="#6b82a8"/>
  <!-- Guard / crossguard -->
  <rect x="10" y="14" width="2" height="2" fill="#ffb300"/>
  <rect x="12" y="14" width="2" height="2" fill="#ffd54f"/>
  <rect x="14" y="14" width="2" height="2" fill="#ffb300"/>
  <rect x="12" y="12" width="2" height="2" fill="#ffb300"/>
  <rect x="16" y="14" width="2" height="2" fill="#ffd54f"/>
  <rect x="18" y="14" width="2" height="2" fill="#ffb300"/>
  <!-- Grip -->
  <rect x="10" y="16" width="2" height="2" fill="#5d3a1a"/>
  <rect x="12" y="16" width="2" height="2" fill="#8b5e34"/>
  <rect x="8" y="18" width="2" height="2" fill="#5d3a1a"/>
  <rect x="10" y="18" width="2" height="2" fill="#8b5e34"/>
  <rect x="12" y="18" width="2" height="2" fill="#5d3a1a"/>
  <!-- Grip wrap -->
  <rect x="10" y="16" width="2" height="2" fill="#7a4f2b"/>
  <rect x="8" y="18" width="2" height="2" fill="#7a4f2b"/>
  <!-- Pommel -->
  <rect x="6" y="20" width="2" height="2" fill="#ffb300"/>
  <rect x="8" y="20" width="2" height="2" fill="#ffd54f"/>
  <rect x="6" y="22" width="2" height="2" fill="#cc8f00"/>
  <rect x="8" y="22" width="2" height="2" fill="#ffb300"/>
</svg>
